[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nf-hotel-data-analysis"
version = "0.1.0"
description = "Local hotel and market data analysis platform: Marimo notebooks and a web API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Used in Phase 1
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1",
    # Declared now, used in later phases
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "polars>=1.0",
    "marimo>=0.8",
    "reportlab>=4.2",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "respx>=0.21",
    "pyyaml>=6",
    "jsonschema>=4.21",
    "types-PyYAML",
    "types-jsonschema",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RUF", "S", "T20", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Error class names are fixed by docs/architecture.md section 8.
"src/app/domain/errors.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src/app"]
branch = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (dependencies point inward)"
type = "layers"
layers = [
    "app.infrastructure",
    "app.adapters",
    "app.application",
    "app.domain",
]

[[tool.importlinter.contracts]]
name = "Adapters are independent of each other"
type = "independence"
modules = [
    "app.adapters.ai",
    "app.adapters.api",
    "app.adapters.data",
    "app.adapters.executor",
    "app.adapters.reports",
    "app.adapters.storage",
]

[[tool.importlinter.contracts]]
name = "Domain and application are free of frameworks and dataframes"
type = "forbidden"
source_modules = ["app.domain", "app.application"]
forbidden_modules = [
    "pydantic",
    "pydantic_settings",
    "fastapi",
    "starlette",
    "polars",
    "pandas",
    "httpx",
    "structlog",
    "marimo",
    "reportlab",
    "matplotlib",
]
