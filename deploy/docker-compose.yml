# The market analysis service. Read by Docker Compose. Settings live in market-analysis.env
# (git-ignored); copy market-analysis.env.example first. Start with, from this folder:
#   docker compose --env-file market-analysis.env up -d --build
# No host port is published and nginx has no route to the service. It runs beside NFHotel on the
# same VM and joins the internal network of the web application and API (NFHotel ADR-0004). The
# web application calls it at http://market-analysis-api:8000 with the header X-API-Key.
# The compose project is named nfanalysis so that it cannot replace NFHotel's own deploy/market-analysis.
name: nfanalysis

services:
  market-analysis-api:
    image: market-analysis:local
    build:
      context: ..
    restart: unless-stopped
    env_file: ${MARKET_ANALYSIS_ENV_FILE:-market-analysis.env}
    expose:
      - "8000"
    volumes:
      - results:/data
    read_only: true
    # The memory limit that MIL-001 criterion 7 measures a run of 55,484 bookings against.
    mem_limit: 2g
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - api

volumes:
  results:

networks:
  api:
    name: ${NFHOTEL_API_NETWORK:-nfhotel-api}
    external: true
